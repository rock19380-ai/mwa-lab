<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MWA Lab Local MWA architecture</title>
<desc id="desc">Android dApp connects over same-device Local MWA to MWA Lab. Approval and disposable signing identity submit only to Solana Devnet. Fault Lab and the protocol recorder provide deterministic failure evidence and sanitized reports. Direct Test Wallet utilities stay outside MWA sessions.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#173048" stroke-width="2"/></marker>
  <style>
    text{font-family:Inter,Arial,sans-serif;fill:#173048}
    .title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#4b6073}
    .box{fill:#fff;stroke:#5d93ad;stroke-width:3;rx:22}
    .accent{fill:#e5f5f2;stroke:#24a68d}.warm{fill:#fff4e5;stroke:#d6a14a}
    .label{font-size:27px;font-weight:700}.small{font-size:19px;fill:#4b6073}
    .line{fill:none;stroke:#173048;stroke-width:3;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="900" fill="#f5f9fc"/>
<text x="80" y="83" class="title">MWA Lab: verified Local MWA path</text>
<text x="80" y="122" class="sub">Developer protocol debugging on Solana Devnet · signed RC2</text>
<rect x="65" y="205" width="270" height="155" class="box"/><text x="95" y="265" class="label">Android dApp</text><text x="95" y="307" class="small">Demo Client verified</text>
<rect x="425" y="205" width="285" height="155" class="box accent"/><text x="455" y="265" class="label">Local MWA</text><text x="455" y="307" class="small">same-device session</text>
<rect x="800" y="205" width="310" height="155" class="box"/><text x="830" y="265" class="label">MWA Lab</text><text x="830" y="307" class="small">authorize · sign · send</text>
<rect x="1200" y="205" width="330" height="155" class="box accent"/><text x="1230" y="265" class="label">Solana Devnet</text><text x="1230" y="307" class="small">fixed RPC authority</text>
<path d="M335 283 H425" class="line"/><path d="M710 283 H800" class="line"/><path d="M1110 283 H1200" class="line"/>
<rect x="65" y="515" width="270" height="160" class="box warm"/><text x="95" y="570" class="label">Fault Lab</text><text x="95" y="610" class="small">deterministic injected</text><text x="95" y="638" class="small">failure provenance</text>
<rect x="425" y="515" width="285" height="160" class="box"/><text x="455" y="570" class="label">Protocol trace</text><text x="455" y="610" class="small">persisted sessions</text><text x="455" y="638" class="small">and diagnostics</text>
<rect x="800" y="515" width="310" height="160" class="box accent"/><text x="830" y="570" class="label">Sanitized report</text><text x="830" y="610" class="small">Markdown · JSON</text><text x="830" y="638" class="small">Copy · Android Share</text>
<rect x="1200" y="515" width="330" height="160" class="box warm"/><text x="1230" y="570" class="label">Test Wallet</text><text x="1230" y="610" class="small">disposable identity</text><text x="1230" y="638" class="small">direct Devnet utility</text>
<path d="M335 595 H425" class="line"/><path d="M960 360 V515" class="line"/><path d="M710 595 H800" class="line"/><path d="M1365 515 V360" class="line"/>
<text x="80" y="785" class="sub">Faults are labeled INJECTED. Direct Test Wallet sends create no dApp → MWA protocol event.</text>
<text x="80" y="828" class="sub">Remote MWA is not released · Receive Test SOL QR is a public Devnet address</text>
</svg>
