name: Android CI

on:
  push:
    branches:
      - main
      - phase1-mwa-protocol-boundary
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew ./scripts/phase1_static.sh

      - name: Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug

      - name: Assemble AndroidTest APKs
        run: ./gradlew :app:assembleDebugAndroidTest :demo-client:assembleDebugAndroidTest

      - name: Verify primary debug APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify demo-client debug APK exists
        run: test -f demo-client/build/outputs/apk/debug/demo-client-debug.apk

      - name: Phase 1 deterministic static gate
        run: ./scripts/phase1_static.sh
