name: Android CI

on:
  push:
    branches:
      - main
      - phase1-mwa-protocol-boundary
      - phase2-core-request-signing
      - phase3-protocol-recorder-timeline
      - phase4-capability-transaction-diagnostics
      - phase5-simulation-diagnostic-classification
      - phase6-deterministic-fault-engine
      - phase7-sanitized-diagnostic-reports
      - phase8-world-class-ux-positioning
      - phase9-first-run-connection-ux
      - phase10-release-candidate-compatibility-evidence
      - phase11-hard-code-freeze
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Phase gates verify frozen predecessor ancestry.
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew ./scripts/phase1_static.sh ./scripts/phase2_static.sh ./scripts/phase3_static.sh ./scripts/phase4_static.sh ./scripts/phase5_static.sh ./scripts/phase6_static.sh ./scripts/phase7_static.sh ./scripts/phase8_static.sh ./scripts/phase9_static.sh
          if [ -f ./scripts/phase10_static.sh ]; then chmod +x ./scripts/phase10_static.sh; fi
          if [ -f ./scripts/phase11_static.sh ]; then chmod +x ./scripts/phase11_static.sh; fi

      - name: Validate shell gate syntax
        run: |
          bash -n ./scripts/phase0_gate.sh ./scripts/phase1_static.sh ./scripts/phase2_static.sh ./scripts/phase3_static.sh ./scripts/phase4_static.sh ./scripts/phase5_static.sh ./scripts/phase6_static.sh ./scripts/phase7_static.sh ./scripts/phase8_static.sh ./scripts/phase9_static.sh
          if [ -f ./scripts/phase10_static.sh ]; then bash -n ./scripts/phase10_static.sh; fi
          if [ -f ./scripts/phase11_static.sh ]; then bash -n ./scripts/phase11_static.sh; fi

      - name: Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug

      - name: Assemble unsigned release buildability APK
        if: ${{ hashFiles('scripts/phase10_static.sh') != '' }}
        run: ./gradlew assembleRelease

      - name: Assemble AndroidTest APKs
        run: ./gradlew :app:assembleDebugAndroidTest :demo-client:assembleDebugAndroidTest

      - name: Verify primary debug APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify unsigned release buildability APK exists
        if: ${{ hashFiles('scripts/phase10_static.sh') != '' }}
        run: test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify demo-client debug APK exists
        run: test -f demo-client/build/outputs/apk/debug/demo-client-debug.apk

      - name: Phase 1 deterministic static gate
        # The Phase 8 presentation moved the safety labels out of MainActivity.
        # Its current-source gate verifies the shared banner and signing screen.
        if: ${{ hashFiles('scripts/phase8_static.sh') == '' }}
        run: ./scripts/phase1_static.sh

      - name: Phase 2 historical scope gate
        if: ${{ hashFiles('app/schemas/dev.mwalab.storage.MwaLabDatabase/1.json') == '' }}
        run: ./scripts/phase2_static.sh

      - name: Phase 3 persistent timeline and predecessor gate
        if: ${{ hashFiles('app/schemas/dev.mwalab.storage.MwaLabDatabase/1.json') != '' && hashFiles('app/schemas/dev.mwalab.storage.MwaLabDatabase/2.json') == '' }}
        run: ./scripts/phase3_static.sh

      - name: Phase 4 capability and transaction diagnostics gate
        if: ${{ hashFiles('app/schemas/dev.mwalab.storage.MwaLabDatabase/2.json') != '' && hashFiles('app/schemas/dev.mwalab.storage.MwaLabDatabase/3.json') == '' }}
        run: ./scripts/phase4_static.sh

      - name: Phase 5 simulation diagnostic classification gate
        if: ${{ hashFiles('app/schemas/dev.mwalab.storage.MwaLabDatabase/3.json') != '' && hashFiles('scripts/phase6_static.sh') == '' }}
        run: ./scripts/phase5_static.sh

      - name: Phase 6 deterministic fault engine gate
        if: ${{ hashFiles('scripts/phase6_static.sh') != '' && hashFiles('scripts/phase7_static.sh') == '' }}
        run: ./scripts/phase6_static.sh

      - name: Phase 7 sanitized diagnostic reports gate
        if: ${{ hashFiles('scripts/phase7_static.sh') != '' && hashFiles('scripts/phase8_static.sh') == '' }}
        run: ./scripts/phase7_static.sh

      - name: Phase 8 UX and protected-boundary gate
        if: ${{ hashFiles('scripts/phase8_static.sh') != '' && hashFiles('scripts/phase9_static.sh') == '' }}
        run: ./scripts/phase8_static.sh

      - name: Phase 9 first-run, Test Wallet, and transport safety gate
        if: ${{ hashFiles('scripts/phase9_static.sh') != '' && hashFiles('scripts/phase10_static.sh') == '' }}
        run: ./scripts/phase9_static.sh

      - name: Phase 10 release identity and safety gate
        if: ${{ hashFiles('scripts/phase10_static.sh') != '' && hashFiles('scripts/phase11_static.sh') == '' }}
        run: ./scripts/phase10_static.sh

      - name: Phase 11 hard-freeze and predecessor gates
        if: ${{ hashFiles('scripts/phase11_static.sh') != '' }}
        run: ./scripts/phase11_static.sh
